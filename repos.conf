# Repo sources for the DSpace dev environment (backend + UI).
#
# Edit these and run `devbox run init-repos` (or `bash scripts/init-repos.sh`)
# to point the submodules at YOUR fork / branch / remote.
#
#   * REPO  : the git remote URL to clone / re-point at
#   * BRANCH: the branch to fetch and check out
#
# Defaults below are the canonical DSpace repos and the branches the template
# ships with. Override per developer / customer / CI without touching any git
# history.

# --- DSpace backend (Spring Boot) ---
DSPACE_REPO="git@github.com:vins01-4science/DSpace.git"
DSPACE_BRANCH="task/main/hot-reload"

# --- DSpace Angular UI ---
DSPACE_ANGULAR_REPO="git@github.com:DSpace/dspace-angular.git"
DSPACE_ANGULAR_BRANCH="main"
