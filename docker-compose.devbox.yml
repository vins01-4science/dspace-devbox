name: dspace-devbox

# Stateless random-port model: each published port uses the single-number form,
# so docker assigns an ephemeral RANDOM host port (never hardcoded, never
# overlapping). Real host ports are discovered at runtime with
#   docker compose port <service> <container-port>
# Data is shared via a single postgres db + main solr cores only.
services:
  db:
    image: postgres:15-alpine
    container_name: dspace-devbox-db
    environment:
      POSTGRES_DB: dspace
      POSTGRES_USER: dspace
      POSTGRES_PASSWORD: dspace
      PGDATA: /pgdata
      DDEV_DBS: ${DDEV_DBS:-dspace}
    ports:
      - "5432"
    volumes:
      - devbox-pgdata:/pgdata
      - ./scripts/pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dspace -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  solr:
    image: solr:9.8
    container_name: dspace-devbox-solr
    user: root
    working_dir: /var/solr/data
    environment:
      SOLR_OPTS: -Dsolr.config.lib.enabled=true
      DDEV_CORES: ${DDEV_CORES:-search,statistics,authority,oai,qaevent,suggestion,audit}
    ports:
      - "8983"
    volumes:
      - devbox-solrdata:/var/solr/data
      - ./DSpace/dspace/solr:/opt/solr/server/solr/configsets:ro
      - ./scripts/solr-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8983'"]
      interval: 5s
      timeout: 5s
      retries: 60

  s3:
    image: floci/floci:latest
    container_name: dspace-devbox-s3
    environment:
      FLOCI_PORT: "4566"
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_S3_ENABLED: "true"
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"
    ports:
      - "4566"
    volumes:
      - devbox-floci:/app/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: dspace-devbox-mailpit
    ports:
      - "1025"
      - "8025"

volumes:
  devbox-pgdata:
  devbox-solrdata:
  devbox-floci: