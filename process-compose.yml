version: "0.5"

processes:
  # --- PostgreSQL 15 (native) ---
  db:
    command: "bash ${DEVBOX_ROOT}/scripts/db-native.sh"
    environment:
      - "DEVBOX_ROOT=${DEVBOX_ROOT}"
      - "DEVBOX_DIR=${DEVBOX_DIR}"
      - "PG_PORT=${PG_PORT:-5432}"
      - "DDEV_DBS=${DDEV_DBS:-dspace}"
    availability:
      restart: "always"
    shutdown:
      # Graceful fast shutdown via pg_ctl; harmless no-op if PG isn't running.
      command: "bash -c 'pg_isready -h 127.0.0.1 -p ${PG_PORT:-5432} >/dev/null 2>&1 && pg_ctl -D ${DEVBOX_DIR}/pgdata stop -m fast || true'"
    readiness:
      exec:
        command: "pg_isready -h 127.0.0.1 -p ${PG_PORT:-5432} -U dspace -d postgres"
        initial_delay_seconds: 2
        period_seconds: 2
        timeout_seconds: 3
        success_threshold: 1
        failure_threshold: 30

  # --- Solr 9.10.1 (native via custom Nix derivation) ---
  solr:
    command: "bash ${DEVBOX_ROOT}/scripts/solr-native.sh"
    environment:
      - "DEVBOX_ROOT=${DEVBOX_ROOT}"
      - "DEVBOX_DIR=${DEVBOX_DIR}"
      - "SOLR_PORT=${SOLR_PORT:-8983}"
      # Lean JVM: match the container-image tuning measured at 191 MB PSS
      # (default bin/solr heap is 512m+AlwaysPreTouch+G1 = ~750 MB).
      - "SOLR_JAVA_MEM=-Xms64m -Xmx128m -XX:TieredStopAtLevel=1 -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=32m -XX:ReservedCodeCacheSize=64m"
      - "GC_TUNE=-XX:+UseSerialGC"
      - "DDEV_CORES=${DDEV_CORES:-search,statistics,authority,oai,qaevent,suggestion,audit}"
    availability:
      restart: "always"
    shutdown:
      command: "bash -c 'solr stop -p $(cat \"${DEVBOX_DIR}/solr-data/.port\" 2>/dev/null || echo \"${SOLR_PORT:-8983}\") >/dev/null 2>&1 || true'"
    readiness:
      exec:
        command: "bash -c 'p=$(cat \"${DEVBOX_DIR}/solr-data/.port\" 2>/dev/null || echo \"${SOLR_PORT:-8983}\"); exec 3<>/dev/tcp/127.0.0.1/\"$p\"'"
        initial_delay_seconds: 5
        period_seconds: 5
        timeout_seconds: 5
        success_threshold: 1
        failure_threshold: 30

  # --- S3 emulator (Ministack, LocalStack-compatible, via custom Nix derivation) ---
  s3:
    command: "bash -c 'mkdir -p ${DEVBOX_DIR}/s3 && exec ministack'"
    environment:
      - "DEVBOX_DIR=${DEVBOX_DIR}"
      - "S3_PORT=${S3_PORT:-4566}"
      - "GATEWAY_PORT=${S3_PORT:-4566}"
      - "MINISTACK_HOST=127.0.0.1"
      - "S3_PERSIST=1"
      - "S3_DATA_DIR=${DEVBOX_DIR}/s3/data"
      - "PERSIST_STATE=1"
      - "STATE_DIR=${DEVBOX_DIR}/s3/state"
      - "MINISTACK_REGION=us-east-1"
      - "MINISTACK_ACCOUNT_ID=000000000000"
    availability:
      restart: "always"
    readiness:
      exec:
        command: "bash -c 'exec 3<>/dev/tcp/127.0.0.1/${S3_PORT:-4566}'"
        initial_delay_seconds: 5
        period_seconds: 3
        timeout_seconds: 5
        success_threshold: 1
        failure_threshold: 40

  # --- Mailpit (native) ---
  mailpit:
    command: "mailpit --smtp 127.0.0.1:${SMTP_PORT:-1025} --listen 127.0.0.1:${MAILPIT_UI_PORT:-8025}"
    environment:
      - "SMTP_PORT=${SMTP_PORT:-1025}"
      - "MAILPIT_UI_PORT=${MAILPIT_UI_PORT:-8025}"
    availability:
      restart: "always"
    readiness:
      exec:
        command: "bash -c 'exec 3<>/dev/tcp/127.0.0.1/${SMTP_PORT:-1025}'"
        initial_delay_seconds: 2
        period_seconds: 2
        timeout_seconds: 3
        success_threshold: 1
        failure_threshold: 10
