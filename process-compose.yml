version: "0.5"

# All-in-Docker variant. process-compose (devbox services) owns the whole
# lifecycle; the single `compose` process materializes the stack declared
# in docker-compose.devbox.yml (postgres + solr + floci + mailpit) via
# `docker compose up -d` and tears it down on shutdown. Containers carry
# `restart: unless-stopped`, so the docker daemon self-heals them; the
# readiness probe + availability.restart re-run the (idempotent) compose
# up if the whole stack disappears.

processes:
  compose:
    command: "bash -c 'docker compose -f ${DEVBOX_ROOT}/docker-compose.devbox.yml up -d'"
    is_daemon: true
    environment:
      - "DEVBOX_ROOT=${DEVBOX_ROOT}"
      - "COMPOSE_TAG=${COMPOSE_TAG:-default}"
      - "PG_PORT=${PG_PORT:-5432}"
      - "SOLR_PORT=${SOLR_PORT:-8983}"
      - "S3_PORT=${S3_PORT:-4566}"
      - "SMTP_PORT=${SMTP_PORT:-1025}"
      - "MAILPIT_UI_PORT=${MAILPIT_UI_PORT:-8025}"
      - "DDEV_CORES=${DDEV_CORES:-search,statistics,authority,oai,qaevent,suggestion,audit}"
    availability:
      restart: "always"
      max_restarts: 0
      backoff: "5s"
    shutdown:
      command: "bash -c 'docker compose -f ${DEVBOX_ROOT}/docker-compose.devbox.yml down'"
      timeout_seconds: 60
    readiness_probe:
      exec:
        command: "pg_isready -h 127.0.0.1 -p ${PG_PORT:-5432} -U dspace -d postgres >/dev/null 2>&1"
      initial_delay_seconds: 2
      period_seconds: 3
      timeout_seconds: 3
      failure_threshold: 40
      success_threshold: 1
